name: Dependabot review policy

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: dependabot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Always call the reusable policy. Skipping this uses: job left owner PRs
  # failing to resolve an orphaned pin (workflow was not found). The reusable
  # workflow owns the Dependabot vs owner-PR job split.
  review:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Pin must stay on a commit reachable from main (squash-merge PR tips orphan).
    uses: AtlasReaper311/atlas-infra/.github/workflows/dependabot-review.yml@5e109b7895a5c224aec7f770a803b66ac1fff914 # fix(ci): repair Dependabot policy reusable pin for owner PRs (#155)
    with:
      automerge_enabled: ${{ vars.DEPENDABOT_AUTOMERGE_ENABLED == 'true' }}
